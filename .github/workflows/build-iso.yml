---
name: Build installer ISO

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: "Publish/Update the ISO on the GitHub Releases page"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/Containerfile'
      - '.github/workflows/build-iso.yml'

env:
  IMAGE_NAME: "schnitzel-os"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  # image-builder CLI, run as a privileged container (the runner is Ubuntu, so
  # the distro package isn't available). Pin to a version/digest once it works.
  IMAGE_BUILDER_CLI: "ghcr.io/osbuild/image-builder-cli:latest"
  # The ISO image type has been documented under two names: `generic-iso`
  # (current docs, migration guide) and `bootc-generic-iso` (older F45 guide).
  # If the build says the type is unknown, switch this value.
  ISO_IMAGE_TYPE: "generic-iso"
  # Fixed names, no dates: the release is updated in place, so the download URL
  # never changes:
  #   https://github.com/<owner>/<repo>/releases/download/installer/SchnitzelOS-Installer.iso
  ISO_FILENAME: "SchnitzelOS-Installer.iso"
  RELEASE_TAG: "installer"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Only supersede stale PR builds; never cancel a run that may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build installer ISO
    # The installer image only includes x86_64 boot tooling (grub2-efi-x64-cdboot).
    #
    # Deliberately NOT ubuntu-26.04: its 7.0 kernel makes osbuild fail at
    # org.osbuild.container-deploy with "mount: /run/osbuild/containers/storage:
    # permission denied" (https://github.com/osbuild/osbuild/issues/2579).
    # ubuntu-24.04 (6.17 kernel) works. Revisit once that issue is fixed.
    runs-on: ubuntu-24.04
    permissions:
      # write is only needed by the "Publish GitHub Release" step. The token is
      # handed to that step alone (checkout below uses persist-credentials: false
      # so it isn't left in .git/config for the privileged build container).
      contents: write
      packages: read

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri (GHCR requires lowercase)
          echo "PAYLOAD_IMAGE=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}" >> "${GITHUB_ENV}"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Build the Anaconda installer environment into *root's* container storage,
      # because image-builder (run via sudo podman) reads from there.
      - name: Build installer image
        run: |
          sudo podman build \
            --build-arg PAYLOAD_IMAGE="${PAYLOAD_IMAGE}" \
            -t localhost/schnitzel-installer:latest \
            -f disk_config/Containerfile \
            disk_config/

      - name: Build ISO
        id: build
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${PWD}/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_CLI}" \
            build \
            --output-dir /output \
            --bootc-ref localhost/schnitzel-installer:latest \
            --bootc-default-fs ext4 \
            "${ISO_IMAGE_TYPE}"
          # The container writes as root; hand the files to the runner user
          sudo chown -R "$(id -u):$(id -g)" output
          find output -type f -exec ls -lh {} +

      # Collect the ISO under its final name, plus a checksum, in dist/. Everything
      # below (artifact, release) publishes from dist/ only.
      - name: Package ISO
        id: package
        run: |
          mapfile -t isos < <(find output -type f -name '*.iso')
          if [ "${#isos[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .iso in output/, found ${#isos[@]}"
            find output -type f
            exit 1
          fi
          mkdir -p dist
          mv "${isos[0]}" "dist/${ISO_FILENAME}"
          (cd dist && sha256sum "${ISO_FILENAME}" > "${ISO_FILENAME}.sha256")
          ls -lh dist
          echo "output-directory=${PWD}/dist" >> "${GITHUB_OUTPUT}"

      # Skipped when the ISO is going to a release (a manual run with
      # publish-release ticked), so it isn't stored twice.
      - name: Upload ISO to Job Artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish-release != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schnitzel-installer-iso
          path: ${{ steps.package.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      # Public, login-free download URL: the release page. GitHub caps each
      # release asset at 2 GiB, so fail early with a clear message if exceeded.
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish-release == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${RELEASE_TAG}"
          SIZE="$(stat -c%s "dist/${ISO_FILENAME}")"
          if [ "${SIZE}" -ge 2147483648 ]; then
            echo "::error::${ISO_FILENAME} is ${SIZE} bytes; GitHub release assets must be under 2 GiB. Host the ISO elsewhere or shrink it."
            exit 1
          fi
          # Release notes live in the repo so they can be edited like any other file.
          NOTES=".github/release-notes/installer.md"
          if [ ! -f "${NOTES}" ]; then
            echo "::error::Release notes file ${NOTES} not found"
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Existing release: re-sync the notes with the file on every publish
            gh release edit "${TAG}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "SchnitzelOS Installer" \
              --latest \
              --notes-file "${NOTES}"
          fi
          # Same tag and file names every time: --clobber replaces the existing assets
          gh release upload "${TAG}" \
            "dist/${ISO_FILENAME}" \
            "dist/${ISO_FILENAME}.sha256" \
            --clobber
